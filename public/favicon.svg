<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle with space gradient -->
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#spaceGrad)" stroke="url(#amberGrad)" stroke-width="2"/>
  
  <!-- Stars -->
  <circle cx="20" cy="25" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="75" cy="20" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="80" cy="70" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="25" cy="75" r="0.8" fill="#fff" opacity="0.5"/>
  
  <!-- HK Letters -->
  <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    HK
  </text>
  
  <!-- Dot accent -->
  <circle cx="72" cy="58" r="4" fill="url(#amberGrad)"/>
  
  <!-- Orbit ring -->
  <ellipse cx="50" cy="50" rx="42" ry="42" fill="none" stroke="url(#amberGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="8,4"/>
</svg>
